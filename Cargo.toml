[package]
name = "dockpit"
version = "0.1.0"
edition = "2024"

[dependencies]
relm4 = { version = "=0.11.0", features = ["libadwaita"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_1"] }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_6"] }
bollard = "=0.21.1"
tokio = { version = "=1.53.3", features = ["sync", "time", "process"] }
futures-util = "0.3"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"
